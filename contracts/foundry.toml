[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 700
via_ir = true
# osaka: the deployed Midnight core (Base, 0xAdedD8ab…18A) uses the Osaka `clz`
# opcode — fork tests executing its bytecode need the osaka runtime spec, which
# requires forge >= 1.5.x (1.0.0 rejects "osaka" / halts with OpcodeNotFound).
# solc 0.8.30 normalizes the codegen target down (prague), so compiled artifacts
# are unchanged; swap-vm's TransientLock (cancun) and the Hedera spike contracts
# (shanghai+) are unaffected.
evm_version = "osaka"
remappings = [
    "axelar-gmp-sdk-solidity/=lib/axelar-gmp-sdk-solidity/",
    "forge-std/=lib/forge-std/src/",
    "swap-vm/=lib/swap-vm/",
    "@openzeppelin/contracts/=lib/swap-vm/node_modules/@openzeppelin/contracts/",
    "@1inch/solidity-utils/=lib/swap-vm/node_modules/@1inch/solidity-utils/",
    "@1inch/aqua/=lib/swap-vm/node_modules/@1inch/aqua/",
]

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
