[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# Paris keeps deploys safe on Hedera's EVM (no PUSH0/Cancun surprises)
evm_version = "paris"
remappings = [
    "axelar-gmp-sdk-solidity/=lib/axelar-gmp-sdk-solidity/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"
base_sepolia = "https://sepolia.base.org"
